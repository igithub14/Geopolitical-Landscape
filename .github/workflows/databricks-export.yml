name: Export Databricks dashboards and publish to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
        shell: bash

      - name: Export dashboards from Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_DASHBOARD_IDS: ${{ secrets.DATABRICKS_DASHBOARD_IDS }}
        run: |
          python .github/scripts/export_dashboards.py
          echo
          echo "=== Exports ==="
          ls -la .github/scripts/exports || true
          echo
          echo "=== Docs (before copy) ==="
          ls -la ./docs || true
        shell: bash

      - name: Prepare docs for Pages
        run: |
          rm -rf ./docs
          mkdir -p ./docs
          # copia tutti gli HTML esportati in ./docs
          cp -v .github/scripts/exports/*.html ./docs/ || true
          echo
          echo "=== Docs (after copy) ==="
          ls -la ./docs || true
        shell: bash

      - name: Debug: list exports and tar contents
        run: |
          echo "=== Exports ==="
          ls -la .github/scripts/exports || true
          echo
          echo "=== Docs ==="
          ls -la ./docs || true
          echo
          echo "=== Prepare debug tar ==="
          TMPDIR="$RUNNER_TEMP/debug_for_pages"
          rm -rf "$TMPDIR"
          mkdir -p "$TMPDIR"
          cp -r .github/scripts/exports/* "$TMPDIR" 2>/dev/null || true
          tar -cvf "$RUNNER_TEMP/debug_pages.tar" -C "$RUNNER_TEMP" debug_for_pages 2>/dev/null || true
          echo
          echo "=== Tar contents ==="
          tar -tvf "$RUNNER_TEMP/debug_pages.tar" 2>/dev/null || echo "(no tar contents)"
          echo
          echo "=== Tar sha256 ==="
          sha256sum "$RUNNER_TEMP/debug_pages.tar" 2>/dev/null || echo "(no sha256)"
        shell: bash

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github/scripts/exports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload export artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: databricks-dashboards
          path: .github/scripts/exports/
