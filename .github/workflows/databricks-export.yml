name: Export Databricks Dashboards

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Export dashboards from Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_DASHBOARD_IDS: ${{ secrets.DATABRICKS_DASHBOARD_IDS }}
        run: python .github/scripts/export_dashboards.py

      - name: Upload exported dashboards
        uses: actions/upload-artifact@v4
        with:
          name: databricks-dashboards
          path: .github/scripts/exports/
