name: Export Databricks dashboards and publish to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
        shell: bash

      - name: Export dashboards from Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_DASHBOARD_IDS: ${{ secrets.DATABRICKS_DASHBOARD_IDS }}
        run: |
          python .github/scripts/export_dashboards.py
        shell: bash

      - name: Prepare docs for Pages (copy index if needed)
        run: |
          rm -rf ./docs
          mkdir -p ./docs
          # copia tutti gli HTML esportati in ./docs (opzionale, non necessario se pubblichi exports direttamente)
          cp -v .github/scripts/exports/*.html ./docs/ || true
          # assicurati che index.html sia in ./docs
          if [ -f ".github/scripts/exports/index.html" ]; then
            cp -v .github/scripts/exports/index.html ./docs/index.html
          fi
          echo "==== ./github/scripts/exports (content) ===="
          ls -la .github/scripts/exports || true
          echo "==== ./docs (content) ===="
          ls -la ./docs || true
        shell: bash

      - name: Debug: show summary sizes (before upload)
        run: |
          echo "=== sizes in .github/scripts/exports ==="
          du -sh .github/scripts/exports || true
          echo "=== list files (with sizes) ==="
          find .github/scripts/exports -maxdepth 1 -type f -exec ls -lh {} \; || true
        shell: bash

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # PUBLISH the actual exports directory (contiene index.html + assets)
          path: .github/scripts/exports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload export artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: databricks-dashboards
          path: .github/scripts/exports/
