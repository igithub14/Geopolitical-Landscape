name: Export Databricks dashboards and publish to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
        shell: bash

      - name: Export dashboards from Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_DASHBOARD_IDS: ${{ secrets.DATABRICKS_DASHBOARD_IDS }}
        run: |
          python .github/scripts/export_dashboards.py
        shell: bash

      - name: Prepare docs for Pages (copy index and set base)
        run: |
          rm -rf ./docs
          mkdir -p ./docs
          # copy all exported HTML into ./docs (keeps original exports as backup)
          cp -v .github/scripts/exports/*.html ./docs/ || true
          # ensure index.html is present in ./docs
          if [ -f ".github/scripts/exports/index.html" ]; then
            cp -v .github/scripts/exports/index.html ./docs/index.html
          fi
          # Insert <base href="/owner/repo/"> so absolute root paths work on repo pages
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -f "./docs/index.html" ]; then
            sed -i "0,/<head>/s//<head>\n<base href=\"\/${repo}\/\">/" ./docs/index.html || true
            echo "Inserted base href into ./docs/index.html"
          else
            echo "No ./docs/index.html to patch"
          fi
          echo "==== .github/scripts/exports (content) ===="
          ls -la .github/scripts/exports || true
          echo "==== ./docs (content) ===="
          ls -la ./docs || true
        shell: bash

      - name: Debug: show summary sizes (before upload)
        run: |
          echo "=== sizes in .github/scripts/exports ==="
          du -sh .github/scripts/exports || true
          echo "=== list files in .github/scripts/exports (with sizes) ==="
          find .github/scripts/exports -maxdepth 1 -type f -exec ls -lh {} \; || true
          echo "=== sizes in ./docs ==="
          du -sh ./docs || true
          echo "=== list files in ./docs (with sizes) ==="
          find ./docs -maxdepth 1 -type f -exec ls -lh {} \; || true
        shell: bash

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the prepared ./docs directory (contains patched index.html + assets)
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload export artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: databricks-dashboards
          path: .github/scripts/exports/
