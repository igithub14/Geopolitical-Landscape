name: Export Databricks dashboards and publish to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'   # ogni ora, cambia se preferisci

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Export dashboards from Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_DASHBOARD_IDS: ${{ secrets.DATABRICKS_DASHBOARD_IDS }}
        run: |
          # lo script scrive in .github/scripts/exports/
          python .github/scripts/export_dashboards.py

      - name: Prepare docs for Pages
        run: |
          rm -rf ./docs
          mkdir -p ./docs
          # copia tutti gli HTML esportati in ./docs
          cp -v .github/scripts/exports/*.html ./docs/ || true

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github/scripts/exports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
